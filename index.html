<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>우리 맛집 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--g:#03c75a;--bg:#fff;--fg:#222;--sub:#888;--line:#eee;--card:#f7f8fa}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--fg);background:var(--bg)}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f2f4f6;z-index:2000}
#lock form{background:#fff;padding:28px 24px;border-radius:14px;box-shadow:0 4px 20px #0001;width:min(320px,90vw);text-align:center}
#lock h1{font-size:18px;margin:0 0 14px}#lock input{width:100%;font-size:20px;padding:10px;border:1px solid #ddd;border-radius:8px;text-align:center;letter-spacing:6px}
#lock button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--g);color:#fff;font-size:15px;font-weight:600}
#err{color:#e53935;font-size:13px;height:16px;margin-top:8px}
#app{display:none;height:100%}
#map{position:absolute;top:0;bottom:0;left:0;right:380px}
#side{position:absolute;top:0;bottom:0;right:0;width:380px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
#side header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
#side h2{margin:0 0 10px;font-size:18px}#q{width:100%;padding:10px 12px;border:2px solid var(--g);border-radius:8px;font-size:14px}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid #ddd;border-radius:16px;padding:5px 11px;font-size:12px;background:#fff;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
#list{overflow-y:auto;flex:1}
.item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.on{background:#f0fbf4}
.item .t{flex:1;min-width:0}.item b{font-size:15px;color:#0068c3}.item .k{font-size:12px;color:var(--sub);margin-left:6px}
.item .m{font-size:13px;margin-top:4px;color:#444}.item .a{font-size:12px;color:var(--sub);margin-top:3px}
.item img{width:72px;height:72px;object-fit:cover;border-radius:6px;flex:none}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:2px 6px;margin-top:6px}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px #0004}
.pin span{display:block;transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:24px}
.leaflet-popup-content{margin:0;width:280px!important}.pop .ph{display:flex;overflow-x:auto;gap:4px}.pop .ph img{height:150px;border-radius:12px 12px 0 0}
.pop .bd{padding:12px 14px}.pop h3{margin:0;font-size:16px}.pop .k{color:var(--sub);font-size:12px}
.pop dl{margin:8px 0 0;font-size:13px;display:grid;grid-template-columns:62px 1fr;gap:4px 8px}.pop dt{color:var(--sub)}.pop dd{margin:0}
.pop .rv{margin-top:10px;background:var(--card);border-radius:8px;padding:9px 10px;font-size:13px;line-height:1.5}
.pop .rv b{display:block;font-size:12px;color:var(--g);margin-bottom:3px}
#nopin{padding:10px 16px;font-size:12px;color:var(--sub)}
@media (max-width:760px){#map{right:0;bottom:62%}#side{top:38%;width:100%;border-left:0;border-top:1px solid var(--line)}
#side header{padding:10px 12px 8px}#side h2{display:none}#q{padding:8px 10px}
#chips{flex-wrap:nowrap;overflow-x:auto;margin-top:8px;padding-bottom:2px}.chip{flex:none}
.item{padding:10px 12px}.item img{width:60px;height:60px}#nopin{padding:6px 12px}}
button{cursor:pointer}button,input,textarea,select{font:inherit}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tools button,.edit{padding:6px 9px;border:1px solid #ccc;border-radius:6px;background:#fff}.storage{font-size:12px;line-height:1.5;color:#555;margin:8px 0 0}#notice{font-size:13px;color:#146b38;white-space:pre-wrap}dialog{width:min(480px,94vw);max-height:90vh;border:0;border-radius:12px;padding:20px}dialog::backdrop{background:#0006}dialog h3{margin-top:0}dialog label{display:block;font-size:13px;margin:10px 0}dialog input,dialog textarea,dialog select{display:block;width:100%;padding:8px;margin-top:4px;border:1px solid #bbb;border-radius:5px}dialog textarea{min-height:90px}.pair{display:flex;gap:12px}.pair label{width:50%}.edit{margin-top:8px}#save-error{color:#b71c1c;font-size:13px}.item .m{white-space:pre-wrap}.pop .rv{white-space:pre-wrap}
</style>
</head>
<body>
<div id="lock"><form id="f"><h1>우리 맛집 지도</h1><input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" autofocus><button>열기</button><div id="err"></div></form></div>
<div id="app"><div id="map"></div><aside id="side"><header><h2>인상·수영 맛집</h2><input id="q" placeholder="이름·메뉴·지역 검색"><div id="chips"></div><div class="tools"><button id="add" type="button">장소 추가</button><button id="export" type="button">암호화 백업</button><button id="import" type="button">백업 가져오기</button><button id="relock" type="button">잠그기</button></div><p class="storage">추가·수정은 이 브라우저와 주소에만 암호화 저장됩니다. 다른 기기·이용자·노션에는 자동 공유되지 않습니다. 브라우저 데이터 삭제 전 백업하세요. 백업은 현재 지도 비밀번호로 열 수 있습니다.</p><div id="notice" role="status" aria-live="polite"></div><input id="backup-file" type="file" accept=".json,application/json" hidden></header><div id="list"></div><div id="nopin"></div></aside></div>
<dialog id="editor"><form id="place-form"><h3 id="editor-title">장소 추가</h3>
<label>장소 이름<input name="name" required maxlength="200"></label><label>지역·주소<input name="area" maxlength="500"></label>
<div class="pair"><label>음식 종류<input name="kind" maxlength="100"></label><label>상태<select name="status"><option>가 봄</option><option>가고 싶음</option><option>확인 필요</option></select></label></div>
<label>대표 메뉴<input name="menu" maxlength="500"></label><label>메모<textarea name="note" maxlength="10000"></textarea></label>
<div class="pair"><label>이동 시간(분)<input name="minutes" type="number" min="0" max="100000" step="1"></label><label>방문일·시간<input name="date" type="datetime-local"></label></div>
<div class="pair"><label>위도<input name="lat" type="number" min="-90" max="90" step="any"></label><label>경도<input name="lon" type="number" min="-180" max="180" step="any"></label></div>
<p class="storage">좌표는 둘 다 입력하거나 비워 주세요. 비우면 목록에서 볼 수 있습니다. 저장 후 지도에서 위치를 확인하세요.</p><label>지도 링크<input name="link" type="url" maxlength="2000" placeholder="https://"></label>
<div id="save-error" role="alert"></div><div class="tools"><button id="save" type="submit">저장</button><button id="cancel" type="button">취소</button></div></form></dialog>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const encoded=bytes=>btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
const STORAGE='date-map-edits-v1';
let password='',overlay={},saving=false,lastStored=null;
try{sessionStorage.removeItem('dm')}catch(_){}
async function derive(pw,e,usage){
  if(e.v!==1||e.iter!==600000||b64(e.salt).length!==16||b64(e.iv).length!==12)throw Error('암호화 형식을 확인해 주세요.');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,usage);
}
async function decrypt(e,pw){const key=await derive(pw,e,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct))))}
async function encrypt(value){
  const e={v:1,iter:600000,salt:encoded(crypto.getRandomValues(new Uint8Array(16))),iv:encoded(crypto.getRandomValues(new Uint8Array(12)))};
  const key=await derive(password,e,['encrypt']);
  e.ct=encoded(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:b64(e.iv)},key,new TextEncoder().encode(JSON.stringify(value)))));return e;
}
const fields=['name','area','kind','status','menu','note','minutes','date','lat','lon','link'];
function validateEdits(value){
  if(!value||value.format!=='date-map-edits'||value.version!==1||!Array.isArray(value.places)||value.places.length>10000)throw Error('맛집 지도 변경분 백업이 아닙니다.');
  const edits=Object.create(null);
  for(const p of value.places){
    if(!p||typeof p.id!=='string'||!p.id||p.id.length>200||Object.hasOwn(edits,p.id))throw Error('장소 식별자가 잘못되었습니다.');
    const clean={id:p.id};
    for(const f of fields){const v=p[f];if(['minutes','lat','lon'].includes(f)){if(v!==null&&(!Number.isFinite(v)|| (f==='minutes'&&(!Number.isInteger(v)||v<0||v>100000))||(f==='lat'&&Math.abs(v)>90)||(f==='lon'&&Math.abs(v)>180)))throw Error('시간·좌표를 확인해 주세요.')}else if(typeof v!=='string'||v.length>10000)throw Error('장소 내용을 확인해 주세요.');clean[f]=v;}
    if(!clean.name.trim()||(clean.lat===null)!==(clean.lon===null)||!safeLink(clean.link)&&clean.link)throw Error('이름·좌표·지도 링크를 확인해 주세요.');
    edits[p.id]=clean;
  }return edits;
}
function safeLink(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
function payload(edits){return {format:'date-map-edits',version:1,places:Object.values(edits)}}
async function persist(edits){const text=JSON.stringify(await encrypt(payload(edits)));if(localStorage.getItem(STORAGE)!==lastStored)throw Error('다른 탭에서 저장이 바뀌었습니다. 입력을 복사해 두고 다시 접속해 주세요.');localStorage.setItem(STORAGE,text);if(localStorage.getItem(STORAGE)!==text)throw Error('저장 확인 실패');lastStored=text;overlay=edits;}
let unlocking=false;
document.getElementById('f').onsubmit=async ev=>{
  ev.preventDefault();if(unlocking)return;unlocking=true;const button=ev.currentTarget.querySelector('button');button.disabled=true;
  try{const err=document.getElementById('err');err.textContent='여는 중...';
  const pw=document.getElementById('pw').value;
  let d;try{const res=await fetch('data.enc',{cache:'no-store'});if(!res.ok)throw Error();d=await decrypt(await res.json(),pw)}catch(_){err.textContent='비밀번호 또는 연결을 확인해 주세요.';return}
  try{const saved=localStorage.getItem(STORAGE);lastStored=saved;overlay=saved?validateEdits(await decrypt(JSON.parse(saved),pw)):Object.create(null)}catch(_){err.textContent='저장된 변경분을 열 수 없어요. 덮어쓰지 않았어요.';return}
  password=pw;document.getElementById('pw').value='';try{sessionStorage.removeItem('dm')}catch(_){}start(d);
  }finally{unlocking=false;button.disabled=false}
};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function grade(m){if(m==null)return['시간 미입력','#9e9e9e'];const h=m/60,t=(Math.floor(h)?Math.floor(h)+'시간 ':'')+(m%60?m%60+'분':'');
  return[t.trim(),m>=180?'#b71c1c':m>=150?'#e53935':m>=120?'#fb8c00':m>=90?'#fbc02d':'#43a047']}
function start(d){
  document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';
  let P=[];
  const notice=document.getElementById('notice');
  const map=L.map('map',{zoomControl:true}).setView([37.56,126.95],11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  let mk=Object.create(null);
  function popup(p){const[g,c]=grade(p.minutes);
    return `<div class="pop">${p.photos.length?`<div class="ph">${p.photos.map(s=>`<img src="${esc(s.src)}">`).join('')}</div>`:''}<div class="bd">
    <h3>${esc(p.name)}</h3><span class="k">${esc(p.kind||'')}${p.status!=='가 봄'?' · 확인 필요':''}</span>
    <dl><dt>위치</dt><dd>${esc(p.area||'-')}</dd>${p.menu?`<dt>대표 메뉴</dt><dd>${esc(p.menu)}</dd>`:''}${p.date?`<dt>방문일</dt><dd>${esc(p.date)}</dd>`:''}</dl>
    <div class="rv"><b>이동 시간 · ${g}</b>${esc(p.note||'아직 후기 없음')}${p.photos.some(s=>s.mine)?'<br><span class="k">우리가 찍은 사진 있음</span>':''}</div>
    ${safeLink(p.link)?`<a href="${esc(safeLink(p.link))}" target="_blank" rel="noopener">지도에서 보기</a>`:''}</div></div>`}
  let kind='전체';
  const chips=document.getElementById('chips');
  function rebuild(){
    Object.values(mk).forEach(m=>m.remove());mk=Object.create(null);
    const merged=new Map(d.places.map(p=>[String(p.id),{...p,id:String(p.id),photos:p.photos||[]}]));
    Object.values(overlay).forEach(p=>merged.set(p.id,{...(merged.get(p.id)||{photos:[]}),...p}));
    P=[...merged.values()].sort((a,b)=>(b.minutes??-1)-(a.minutes??-1));
    P.forEach((p,i)=>{if(p.lat==null||p.lon==null)return;const[,c]=grade(p.minutes);
      mk[p.id]=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${c}"><span>${i+1}</span></div>`,iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-26]})}).bindPopup(popup(p),{maxWidth:300}).addTo(map);
      mk[p.id].on('mouseover',function(){this.openPopup()});
    });
    const kinds=['전체',...new Set(P.map(p=>p.kind).filter(Boolean))];if(!kinds.includes(kind))kind='전체';
    chips.innerHTML=kinds.map(k=>`<span class="chip${k===kind?' on':''}" data-k="${esc(k)}">${esc(k)}</span>`).join('');
    render();document.getElementById('nopin').textContent=`핀 ${Object.keys(mk).length}곳 · 위치 미상 ${P.length-Object.keys(mk).length}곳은 목록에만`;
  }
  chips.onclick=e=>{const k=e.target.dataset.k;if(!k)return;kind=k;[...chips.children].forEach(c=>c.classList.toggle('on',c.dataset.k===k));render()};
  document.getElementById('q').oninput=render;
  function render(){const q=document.getElementById('q').value.trim();
    const L2=P.map((p,i)=>[p,i]).filter(([p])=>(kind==='전체'||p.kind===kind)&&(!q||[p.name,p.menu,p.area,p.note].join(' ').includes(q)));
    document.getElementById('list').innerHTML=L2.map(([p,i])=>{const[g,c]=grade(p.minutes);
      return `<div class="item" data-id="${esc(p.id)}"><div class="t"><b>${i+1}. ${esc(p.name)}</b><span class="k">${esc(p.kind||'')}</span>
      ${p.menu?`<div class="m">${esc(p.menu)}</div>`:''}<div class="a">${esc(p.area||'')}${p.lat!=null?'':(p.area?' · ':'')+'지도 밖'}</div>
      <span class="badge" style="background:${c}">${g}</span>${p.date?`<div class="a">방문 ${esc(p.date)}</div>`:''}${p.note?`<div class="m">${esc(p.note)}</div>`:''}<br><button class="edit" type="button" aria-label="${esc(p.name)} 편집">편집</button></div>${p.photos[0]?`<img src="${esc(p.photos[0].src)}">`:''}</div>`}).join('');
    Object.entries(mk).forEach(([id,m])=>{const on=L2.some(([p])=>p.id===id);on?m.addTo(map):m.remove()});
  }
  document.getElementById('list').onclick=e=>{const it=e.target.closest('.item');if(!it)return;if(e.target.closest('.edit')){edit(P.find(p=>p.id===it.dataset.id));return}const m=mk[it.dataset.id];
    document.querySelectorAll('.item').forEach(x=>x.classList.toggle('on',x===it));if(m){map.flyTo(m.getLatLng(),16);setTimeout(()=>m.openPopup(),400)}};
  const dialog=document.getElementById('editor'),form=document.getElementById('place-form');let editingId=null,originalDate='',initialDate='';
  function edit(p){
    editingId=p?.id||crypto.randomUUID();form.reset();document.getElementById('save-error').textContent='';
    document.getElementById('editor-title').textContent=p?'장소 편집':'장소 추가';
    for(const f of fields){let v=p?.[f]??'';if(f==='date'&&v.length===10)v+='T00:00';if(f==='date')v=v.slice(0,16);form.elements[f].value=v}
    originalDate=p?.date??'';initialDate=form.elements.date.value;
    if(!p)form.elements.status.value='가고 싶음';dialog.showModal();
  }
  document.getElementById('add').onclick=()=>edit();
  document.getElementById('cancel').onclick=()=>{if(!saving)dialog.close()};
  dialog.addEventListener('cancel',e=>{if(saving)e.preventDefault()});
  form.onsubmit=async e=>{
    e.preventDefault();if(saving)return;const p={id:editingId};
    for(const f of fields){const v=form.elements[f].value.trim();p[f]=['minutes','lat','lon'].includes(f)?(v===''?null:Number(v)):v}
    if(form.elements.date.value===initialDate)p.date=originalDate;
    try{
      validateEdits(payload({[p.id]:p}));saving=true;document.getElementById('save').disabled=true;
      await persist({...overlay,[p.id]:p});rebuild();dialog.close();notice.textContent='이 브라우저에 암호화 저장했어요.';
    }catch(err){document.getElementById('save-error').textContent='저장하지 못했어요. '+(err.name==='QuotaExceededError'?'브라우저 저장 공간이 부족합니다. 백업 후 공간을 확보해 주세요.':err.message)}
    finally{saving=false;document.getElementById('save').disabled=false}
  };
  document.getElementById('export').onclick=async()=>{
    try{const blob=new Blob([JSON.stringify(await encrypt(payload(overlay)))],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='date-map-edits.encrypted.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice.textContent='변경분 암호화 백업을 내려받았어요. 원본 장소·사진은 포함하지 않습니다.'}catch(_){notice.textContent='백업하지 못했어요. 다시 시도해 주세요.'}
  };
  const file=document.getElementById('backup-file');
  document.getElementById('import').onclick=()=>file.click();
  file.onchange=async()=>{
    if(!file.files[0])return;
    if(saving){notice.textContent='저장이 진행 중입니다. 잠시 후 다시 가져오세요.';file.value='';return}
    saving=true;
    try{
      if(file.files[0].size>10000000)throw Error('파일이 너무 큽니다.');
      const imported=validateEdits(await decrypt(JSON.parse(await file.files[0].text()),password));
      if(!confirm(`변경분 ${Object.keys(imported).length}곳을 가져올까요? 같은 장소의 기존 변경분은 백업 내용으로 바뀝니다.`))return;
      await persist({...overlay,...imported});rebuild();notice.textContent='백업 변경분을 가져와 암호화 저장했어요.';
    }catch(err){notice.textContent='가져오지 못했어요. 기존 저장은 유지됩니다. 비밀번호·백업 파일을 확인해 주세요.'}finally{saving=false;file.value=''}
  };
  document.getElementById('relock').onclick=()=>{if(!saving)location.reload()};
  rebuild();
  const pinned=Object.values(mk);if(pinned.length)map.fitBounds(L.featureGroup(pinned).getBounds().pad(0.1));
}
</script>
</body>
</html>
